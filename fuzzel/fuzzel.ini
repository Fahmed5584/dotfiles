[main]
lines = 4
width = 25
font = JetBrainsMono Nerd Font:size=7:style=thin
placeholder = "Search "
terminal = kitty -e {cmd}
horizontal-pad = 15
enable-mouse = false

[colors]
background=1e1e2edd
text=cdd6f4ff
prompt=bac2deff
placeholder=7f849cff
input=cdd6f4ff
match=74c7ecff
selection=585b70ff
selection-text=cdd6f4ff
selection-match=74c7ecff
counter=7f849cff
border=74c7ecff

[border]
radius = 5
selection-radius = 2
